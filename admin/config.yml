backend:
  name: git-gateway
  branch: main

# Erlaubt lokales Testen ohne Netlify-Login (nur wenn die Seite von
# localhost aus aufgerufen wird – auf der echten, veröffentlichten Seite
# wird automatisch der git-gateway-Login oben verwendet).
local_backend: true

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "speisekarte"
    label: "Speisekarte"
    files:
      - file: "content/speisekarte.json"
        label: "Speisekarte"
        name: "speisekarte"
        fields:
          - label: "Abschnitte (Kategorien, Empfehlungen, Hinweistexte)"
            name: "sections"
            widget: "list"
            summary: "{{title}} ({{type}})"
            fields:
              - label: "Art"
                name: "type"
                widget: "select"
                options:
                  - { label: "Kategorie (mit Liste von Gerichten)", value: "kategorie" }
                  - { label: "Empfehlung (hervorgehobene Box, z. B. Sonntagsbraten)", value: "empfehlung" }
                  - { label: "Reiner Hinweistext (Box ohne Gerichte-Liste)", value: "hinweistext" }
              - { label: "Titel / Überschrift", name: "title", widget: "string", required: false }
              - label: "Text"
                name: "text"
                widget: "text"
                required: false
                hint: "Bei „Kategorie“: kurzer Zusatztext unter der Überschrift (z. B. bei Salaten). Bei „Hinweistext“: der komplette Text der Box."
              - { label: "Volle Breite (2 Spalten) – nur bei Kategorie", name: "wide", widget: "boolean", default: false, required: false }
              - { label: "Goldener Rahmen (Hervorhebung) – nur bei Kategorie", name: "accent", widget: "boolean", default: false, required: false }
              - { label: "Hinweisbox – Titel (optional) – nur bei Kategorie", name: "hint_title", widget: "string", required: false }
              - { label: "Hinweisbox – Text (optional) – nur bei Kategorie", name: "hint_text", widget: "text", required: false }
              - { label: "Name des Gerichts – nur bei Empfehlung", name: "highlight_name", widget: "string", required: false }
              - { label: "Beschreibung – nur bei Empfehlung", name: "highlight_desc", widget: "string", required: false }
              - { label: "Preis – nur bei Empfehlung", name: "highlight_price", widget: "string", required: false }
              - label: "Gerichte – nur bei Kategorie"
                name: "items"
                widget: "list"
                required: false
                summary: "{{name}} – {{price}}"
                fields:
                  - { label: "Nummer (optional, z. B. 26.)", name: "nummer", widget: "string", required: false }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Beschreibung (optional)", name: "description", widget: "string", required: false }
                  - { label: "Preis", name: "price", widget: "string" }
          - label: "Fußnotizen (unter der Speisekarte, z. B. Allergene, Events)"
            name: "footnotes"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

  - name: "wochenkarte"
    label: "Wochen-Speisekarte"
    files:
      - file: "content/wochenkarte.json"
        label: "Wochen-Speisekarte"
        name: "wochenkarte"
        fields:
          - label: "Abschnitte (normalerweise reicht 1 Kategorie „Diese Woche“)"
            name: "sections"
            widget: "list"
            summary: "{{title}} ({{type}})"
            fields:
              - label: "Art"
                name: "type"
                widget: "select"
                options:
                  - { label: "Kategorie (mit Liste von Gerichten)", value: "kategorie" }
                  - { label: "Empfehlung (eine einzelne, groß hervorgehobene Box)", value: "empfehlung" }
                  - { label: "Reiner Hinweistext (Box ohne Gerichte-Liste)", value: "hinweistext" }
              - { label: "Titel / Überschrift", name: "title", widget: "string", required: false }
              - label: "Text"
                name: "text"
                widget: "text"
                required: false
                hint: "Bei „Kategorie“: kurzer Zusatztext unter der Überschrift. Bei „Hinweistext“: der komplette Text der Box."
              - { label: "Volle Breite (2 Spalten) – nur bei Kategorie", name: "wide", widget: "boolean", default: true, required: false }
              - { label: "Hinweisbox – Titel (optional) – nur bei Kategorie", name: "hint_title", widget: "string", required: false }
              - { label: "Hinweisbox – Text (optional) – nur bei Kategorie", name: "hint_text", widget: "text", required: false }
              - { label: "Name des Gerichts – nur bei Empfehlung", name: "highlight_name", widget: "string", required: false }
              - { label: "Beschreibung – nur bei Empfehlung", name: "highlight_desc", widget: "string", required: false }
              - { label: "Preis – nur bei Empfehlung", name: "highlight_price", widget: "string", required: false }
              - label: "Gerichte – nur bei Kategorie"
                name: "items"
                widget: "list"
                required: false
                summary: "{{name}} – {{price}}"
                fields:
                  - { label: "Nummer (optional)", name: "nummer", widget: "string", required: false }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Beschreibung (optional)", name: "description", widget: "string", required: false }
                  - { label: "Preis", name: "price", widget: "string" }

  - name: "bilder"
    label: "Bilder der Website"
    files:
      - file: "content/bilder.json"
        label: "Bilder der Website"
        name: "bilder"
        fields:
          - label: "Startbild (ganz oben)"
            name: "hero"
            widget: "object"
            hint: "Das große Bild beim Öffnen der Seite. Querformat, ca. 2000 Pixel breit, möglichst unter 1 MB (große Handyfotos vorher verkleinern, sonst lädt die Seite langsam)."
            fields:
              - { label: "Bild", name: "bild", widget: "image" }
              - { label: "Bildbeschreibung (für Suchmaschinen und Screenreader)", name: "alt", widget: "string", required: false, hint: "Leer lassen, wenn das Bild nur Stimmung ist." }
          - label: "Bild „Willkommen“"
            name: "willkommen"
            widget: "object"
            hint: "Bild neben dem Willkommenstext. Querformat, ca. 2000 Pixel breit, möglichst unter 1 MB (große Handyfotos vorher verkleinern, sonst lädt die Seite langsam)."
            fields:
              - { label: "Bild", name: "bild", widget: "image" }
              - { label: "Bildbeschreibung (für Suchmaschinen und Screenreader)", name: "alt", widget: "string", required: false, hint: "z. B. Gedeckter Tisch im Restaurant" }
          - label: "Karte „Deutsche Klassiker“"
            name: "klassiker"
            widget: "object"
            hint: "Bild der ersten Karte im Bereich Küche. Querformat, ca. 2000 Pixel breit, möglichst unter 1 MB (große Handyfotos vorher verkleinern, sonst lädt die Seite langsam)."
            fields:
              - { label: "Bild", name: "bild", widget: "image" }
              - { label: "Bildbeschreibung (für Suchmaschinen und Screenreader)", name: "alt", widget: "string", required: false, hint: "Was ist auf dem Foto zu sehen?" }
          - label: "Karte „Desserts & Konditorei“"
            name: "konditorei"
            widget: "object"
            hint: "Bild der zweiten Karte im Bereich Küche. Querformat, ca. 2000 Pixel breit, möglichst unter 1 MB (große Handyfotos vorher verkleinern, sonst lädt die Seite langsam)."
            fields:
              - { label: "Bild", name: "bild", widget: "image" }
              - { label: "Bildbeschreibung (für Suchmaschinen und Screenreader)", name: "alt", widget: "string", required: false, hint: "Was ist auf dem Foto zu sehen?" }
          - label: "Bild im Reservierungs-Band"
            name: "cta"
            widget: "object"
            hint: "Hintergrundbild vor „Einen Tisch im NIDDAHAUS?“. Querformat, ca. 2000 Pixel breit, möglichst unter 1 MB (große Handyfotos vorher verkleinern, sonst lädt die Seite langsam)."
            fields:
              - { label: "Bild", name: "bild", widget: "image" }
              - { label: "Bildbeschreibung (für Suchmaschinen und Screenreader)", name: "alt", widget: "string", required: false, hint: "Leer lassen, wenn das Bild nur Stimmung ist." }
